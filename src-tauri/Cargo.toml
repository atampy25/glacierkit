[package]
name = "app"
version = "1.12.15"
description = "An integrated modding tool for the HITMAN World of Assassination trilogy."
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.glacier-bin1]
debug = false

[profile.dev]
opt-level = 1

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies]
tryvial = "0.2.0"
anyhow = "1.0.102"
fn-error-context = "0.2.1"
walkdir = "2.4.0"
itertools = "0.14.0"
trash = "5.2.1"
velcro = "0.5.4"
indexmap = "2.14.0"
arboard = "3.3.0"
rand = "0.10.1"
glacier-ini = "0.1.0"
rayon = "1.10.0"
tauri-plugin-aptabase = "1.0.0"
image = "0.25.5"
json-patch = "4.1.0"
futures-util = "0.3.31"
hrtime = "0.2.0"
tokio-tungstenite = "0.29.0"
debounced = "0.2.0"
notify-debouncer-full = "0.7.0"
tokio-stream = "0.1.17"
log = { version = "0.4.33", features = ["max_level_debug"] }
biome_json_formatter = "0.5.7"
biome_json_parser = "0.5.7"
biome_formatter = "0.5.7"
biome_rowan = "=0.5.7"
biome_parser = "=0.5.7"
biome_unicode_table = "=0.5.7"
os_info = "3.9.2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
specta-typescript = "0.0.11"
ordermap = "1.2.0"
ecow = { version = "0.3.0", features = ["serde"] }
ww2ogg = "0.1.0"
schemars = "1.2.1"
matchers = "0.2.0"
nesting = "0.1.1"
static_init = "1.0.4"
facet = "0.46.0"
whirlwind = { git = "https://github.com/klaatu01/whirlwind", branch = "stream", features = ["stream"] }
papaya = "0.2.4"
identity-hash = "0.1.0"
optivorbis = "0.3.0"
showfile = "0.1.1"
percent-encoding = "2.3.2"
strum = { version = "0.28.0", features = ["derive"] }
regex = "1.12.3"
lazy-regex = "3.6.0"
rapidhash = { version = "4.4.1", features = ["rand", "unsafe"] }
regex-automata = "0.4.14"
dirs = "6.0.0"
mesh-tools = "0.4.0"
tempfile = "3.27.0"
glam = { version = "0.32.1", features = ["serde"] }
slotmap = { version = "1.1.1", features = ["serde"] }
bevy = { version = "0.19.0", features = ["bevy_dev_tools", "debug", "free_camera", "pbr_specular_textures", "dds", "tga"] }
flume = "0.12.0"
bevy_panorbit_camera = "0.35.0"
ttmap = "0.3.0"
parking_lot = "0.12.5"
dashmap = { version = "6.2.1", features = ["rayon"] }
bevy-inspector-egui = { version = "0.37.0", optional = true }
egui = { version = "0.34.3", optional = true }
bevy_mod_outline = "0.13.0"
delegate = "0.13.5"
arc-trait = "0.1.2"
inventory = "0.3.24"
serde-brief = { version = "0.2.0", features = ["std"] }
bevy_tasks = { version = "0.19.0", features = ["multi_threaded"] }

[dependencies.tokio]
version = "1.43.0"
features = ["macros", "rt-multi-thread"]

[dependencies.reqwest]
version = "0.13.2"
features = ["json"]

[dependencies.derive_more]
version = "2.1.1"
features = ["debug"]

[dependencies.rpkg-rs]
git = "https://github.com/dafitius/rpkg-rs"
branch = "v2"

[dependencies.rpkg-rs-1]
package = "rpkg-rs"
version = "1.4.0"

[dependencies.glacier-bin1]
git = "https://github.com/atampy25/glacier-bin1"
features = ["all-games", "all-types"]

[dependencies.hitman-behavior]
git = "https://github.com/atampy25/hitman-behavior"

[dependencies.glacier-commons]
git = "https://github.com/atampy25/glacier-commons"
features = ["serde", "specta", "rpkg-rs-1", "rpkg-rs-2", "glacier-texture", "tonytools", "hash-list", "hash-list-download", "game-detection", "macros"]

[dependencies.glacier-formats]
git = "https://github.com/atampy25/glacier-formats"
features = ["material", "ores", "wwev", "serde", "sdef", "texture"]

[dependencies.serde_json]
version = "1.0.138"
features = ["preserve_order"]

[dependencies.serde]
version = "1.0.194"
features = ["derive"]

[dependencies.tauri]
version = "2"
features = ["devtools"]

[dependencies.specta]
version = "=2.0.0-rc.24"
features = ["url", "uuid", "indexmap"]

[dependencies.tauri-specta]
git = "https://github.com/atampy25/tauri-specta"
features = ["typescript"]

[dependencies.uuid]
version = "1.12.1"
features = ["serde", "v4"]

[dependencies.arc-swap]
version = "1.6.0"
features = ["serde"]

[dependencies.notify]
version = "8.0.0"
default-features = false
features = ["macos_fsevent"]

[dependencies.quickentity-rs]
git = "https://github.com/atampy25/quickentity-rs"
branch = "v3.2"
features = ["schemars", "all-games"]

[dependencies.glacier-texture]
version = "2.1.1"

[dependencies.glacier-geometry]
git = "https://github.com/dafitius/GlacierFormats-rs"
branch = "primitive-refactor"

[dependencies.tonytools]
git = "https://github.com/AnthonyFuller/tonytools-rs"

[dependencies.image_0_24]
package = "image"
version = "0.24.9"

[dependencies.tauri-plugin-log]
version = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[features]
bevy-dynamic-linking = ["bevy/dynamic_linking"]
bevy-inspector-egui = ["dep:bevy-inspector-egui", "dep:egui", "bevy_panorbit_camera/bevy_egui"]
