[package]
name = "app"
version = "1.12.15"
description = "An integrated modding tool for the HITMAN World of Assassination trilogy."
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.hitman-bin1]
debug = false

[profile.dev]
opt-level = 1

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies]
tryvial = "0.2.0"
anyhow = "1.0.102"
fn-error-context = "0.2.1"
walkdir = "2.4.0"
registry = "1.3.0"
keyvalues-serde = "0.2.2"
itertools = "0.14.0"
serde-smile = "0.3.1"
brotli-decompressor = "5.0.0"
trash = "5.2.1"
velcro = "0.5.4"
indexmap = "2.14.0"
arboard = "3.3.0"
rand = "0.10.1"
rpkg-rs = "1.3.1"
glacier-ini = "0.1.0"
async-recursion = "1.0.5"
parking_lot = "0.12.1"
rayon = "1.10.0"
tauri-plugin-aptabase = "1.0.0"
image = "0.25.5"
hex = "0.4.3"
serde_with = "3.18.0"
json-patch = "4.1.0"
futures-util = "0.3.31"
md5 = "0.8.0"
measure_time = "0.9.0"
regex = "1.10.4"
hrtime = "0.2.0"
async-trait = "0.1.86"
tokio-tungstenite = "0.29.0"
serde_path_to_error = "0.1.16"
debounced = "0.2.0"
notify-debouncer-full = "0.7.0"
tokio-stream = "0.1.17"
log = "0.4.25"
biome_json_formatter = "0.5.7"
biome_json_parser = "0.5.7"
biome_formatter = "0.5.7"
biome_rowan = "=0.5.7"
biome_parser = "=0.5.7"
biome_unicode_table = "=0.5.7"
os_info = "3.9.2"
home = "0.5.11"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
specta-typescript = "0.0.11"
ordermap = "1.2.0"
ecow = { version = "0.2.6", features = ["serde"] }
ww2ogg = "0.1.0"
schemars = "1.2.1"
matchers = "0.2.0"
nesting = "0.1.1"

[dependencies.tokio]
version = "1.43.0"
features = ["macros", "rt"]

[dependencies.reqwest]
version = "0.13.2"
features = ["json"]

[dependencies.derive_more]
version = "2.1.1"
features = ["debug"]

[dependencies.hitman-bin1]
git = "https://github.com/atampy25/hitman-bin1"
features = ["all-games", "all-types"]

[dependencies.hitman-commons]
git = "https://github.com/atampy25/hitman-commons"
features = ["serde", "specta", "rpkg-rs", "glacier-texture", "tonytools", "hash_list", "game_detection"]

[dependencies.hitman-formats]
git = "https://github.com/atampy25/hitman-formats"
features = ["material", "ores", "wwev", "serde", "sdef"]

[dependencies.serde_json]
version = "1.0.138"
features = ["preserve_order"]

[dependencies.serde]
version = "1.0.194"
features = ["derive"]

[dependencies.tauri]
version = "2"
features = ["protocol-asset", "devtools"]

[dependencies.specta]
version = "=2.0.0-rc.24"
features = ["url", "uuid", "indexmap", "collect"]

[dependencies.tauri-specta]
git = "https://github.com/atampy25/tauri-specta"
features = ["typescript"]

[dependencies.uuid]
version = "1.12.1"
features = ["serde", "v4"]

[dependencies.arc-swap]
version = "1.6.0"
features = ["serde"]

[dependencies.notify]
version = "8.0.0"
default-features = false
features = ["macos_fsevent"]

[dependencies.quickentity-rs]
git = "https://github.com/atampy25/quickentity-rs"
branch = "v3.2"
features = ["schemars"]

[dependencies.enumset]
version = "1.1.3"
features = ["serde"]

[dependencies.dashmap]
version = "6.1.0"
features = ["inline", "rayon"]

[dependencies.glacier-texture]
version = "1.0.0"

[dependencies.prim-rs]
git = "https://github.com/dafitius/GlacierFormats-rs"

[dependencies.hashbrown]
version = "0.17.0"
features = ["rayon", "serde"]

[dependencies.tonytools]
git = "https://github.com/AnthonyFuller/tonytools-rs"

[dependencies.tauri-plugin-log]
version = "2"

[target."cfg(unix)".dependencies]
fork = "0.7.0"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
