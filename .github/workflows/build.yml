name: Build

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "ubuntu-24.04"
                    - platform: "windows-latest"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Set up Rust (Linux)
              uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f
              if: matrix.platform == 'ubuntu-24.04'
              with:
                  profile: minimal
                  toolchain: nightly-2026-05-28
                  target: x86_64-unknown-linux-gnu
                  components: clippy, rustfmt
                  default: true

            - name: Set up Rust (Windows)
              uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f
              if: matrix.platform == 'windows-latest'
              with:
                  profile: minimal
                  toolchain: nightly-2026-05-28
                  target: x86_64-pc-windows-msvc
                  components: clippy, rustfmt
                  default: true

            - name: Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              with:
                  prefix-key: v0-rust-${{ matrix.platform }}
                  workspaces: "src-tauri -> target"

            - name: Install build dependencies (Ubuntu only)
              if: matrix.platform == 'ubuntu-24.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                  sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

            - name: Install front-end dependencies
              run: |
                  yarn set version 4.0.2
                  yarn

            - name: Disable updater
              uses: restackio/update-json-file-action@2.1
              with:
                  file: "src-tauri/tauri.conf.json"
                  fields: '{"bundle.createUpdaterArtifacts": false}'

            - name: Write env file
              uses: DamianReeves/write-file-action@v1.0
              with:
                  path: "./.env"
                  contents: |
                      DUMMY_ENV=dummy

            - name: Build
              env:
                  NODE_OPTIONS: "--max-old-space-size=4096"
                  CARGO_BUILD_JOBS: 2
              run: |
                  yarn tauri build --verbose

            - name: Get latest tag
              id: latest_tag
              uses: WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de

            - name: Upload artifact (Linux)
              if: matrix.platform == 'ubuntu-24.04'
              uses: actions/upload-artifact@v7.0.1
              with:
                  path: src-tauri/target/release/bundle/appimage/GlacierKit_${{ steps.latest_tag.outputs.tag }}_amd64.AppImage
                  archive: false

            - name: Upload artifact (Windows)
              if: matrix.platform == 'windows-latest'
              uses: actions/upload-artifact@v7.0.1
              with:
                  path: src-tauri\target\release\bundle\msi\GlacierKit_${{ steps.latest_tag.outputs.tag }}_x64_en-US.msi
                  archive: false
